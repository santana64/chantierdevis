services:
  postgres:
    image: postgres:16-alpine
    container_name: chantierdevis-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chantierdevis
    ports:
      - "55432:5432"
    volumes:
      - chantierdevis-postgres:/var/lib/postgresql/data

volumes:
  chantierdevis-postgres:
